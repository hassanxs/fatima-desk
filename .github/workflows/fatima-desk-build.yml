# Fatima Desk: macOS and Linux builds.
#
# Run it from GitHub: Actions -> "Fatima Desk build" -> Run workflow, and tick
# the targets you want. Each run uploads its packages as artifacts (kept for
# 7 days, to stay inside the 500 MB artifact storage of a free private repo).
#
# The steps follow RustDesk's flutter-build.yml (build-for-macOS and
# build-rustdesk-linux), trimmed to what Fatima Desk ships: unsigned DMGs for
# Apple Silicon and Intel Macs, and .deb/.rpm packages for 64-bit Linux.
# Nothing here publishes a release or pushes images to a registry.
#
# Cost on a private repo: macOS minutes count 10x. A cold Mac build takes
# roughly 40-60 runner minutes (400-600 billed); Rust and vcpkg caches make
# later runs faster.

name: Fatima Desk build

on:
  workflow_dispatch:
    inputs:
      macos_arm64:
        description: "macOS Apple Silicon (.dmg)"
        type: boolean
        default: true
      macos_x64:
        description: "macOS Intel (.dmg)"
        type: boolean
        default: true
      linux_x64:
        description: "Linux x86_64 (.deb, .rpm)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81" # cidre needs 1.81 on macOS
  FLUTTER_VERSION: "3.24.5"
  # 3.24.5's engine crashes on Apple Silicon (rustdesk#16817); upstream uses 3.44 there.
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"

jobs:
  plan:
    name: Choose targets
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.plan.outputs.macos }}
      any_macos: ${{ steps.plan.outputs.any_macos }}
    steps:
      - id: plan
        run: |
          m='[]'
          if [ "${{ inputs.macos_arm64 }}" = "true" ]; then
            m=$(echo "$m" | jq -c '. + [{"target":"aarch64-apple-darwin","os":"macos-15","arch":"aarch64","extra-build-args":"--screencapturekit"}]')
          fi
          if [ "${{ inputs.macos_x64 }}" = "true" ]; then
            m=$(echo "$m" | jq -c '. + [{"target":"x86_64-apple-darwin","os":"macos-15-intel","arch":"x86_64","extra-build-args":""}]')
          fi
          echo "macos=$m" >> "$GITHUB_OUTPUT"
          [ "$m" = "[]" ] && echo "any_macos=false" >> "$GITHUB_OUTPUT" || echo "any_macos=true" >> "$GITHUB_OUTPUT"
          echo "macOS targets: $m"

  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-macos:
    name: macOS ${{ matrix.job.arch }}
    needs: [plan, generate-bridge]
    if: needs.plan.outputs.any_macos == 'true'
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          command -v pkg-config >/dev/null || brew install pkg-config

      - name: Install NASM 2.16 (aom needs 2.x, brew ships 3.x)
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Patch flutter (x86_64, Flutter 3.24.5)
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Workaround for flutter issue 133533
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch sources for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: fatimadesk-${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; echo; done
            exit 1
          fi

      - name: Build Fatima Desk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Create unsigned DMG
        run: |
          APP=./flutter/build/macos/Build/Products/Release/FatimaDesk.app
          test -d "$APP"
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --volname "Fatima Desk" --icon "FatimaDesk.app" 200 190 --hide-extension "FatimaDesk.app" \
            --window-size 800 400 --app-drop-link 600 185 \
            "fatimadesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg" "$APP"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fatimadesk-${{ env.VERSION }}-macos-${{ matrix.job.arch }}
          path: fatimadesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Linux x86_64
    needs: [generate-bridge]
    if: inputs.linux_x64
    runs-on: ubuntu-22.04
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm qemu-user-static

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set swap space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: echo "RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')" >> $GITHUB_ENV

      - name: Only build the cdylib
        run: sed -i "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          sudo apt install -y libva-dev
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; echo; done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      # Built inside Ubuntu 18.04 so the packages run on old and new distros (glibc 2.27+).
      # No githubToken: the action would otherwise cache its image in this repo's
      # package registry, which counts against a private repo's storage.
      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8
        name: Build Fatima Desk
        with:
          arch: x86_64
          distro: ubuntu18.04
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            apt-get install -y build-essential clang cmake curl gcc git g++ \
              libayatana-appindicator3-dev libasound2-dev libclang-10-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev \
              libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
              libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-10-dev nasm \
              ninja-build pkg-config tree python3 rpm unzip wget xz-utils libssl-dev
            apt-get remove -y libopus-dev || true
          run: |
            set -e
            git config --global --add safe.directory "*"
            # Rust (standalone installer; rustup runs out of memory in this container)
            pushd /opt
            wget -q -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu.tar.gz
            tar -zxf rust.tar.gz && rm rust.tar.gz
            (cd rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu && ./install.sh)
            rm -rf rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu
            mkdir -p ~/.cargo/
            printf "[source.crates-io]\nregistry = 'https://github.com/rust-lang/crates.io-index'\n" > ~/.cargo/config
            popd

            # Rust core
            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            cargo build --locked --lib --features hwcodec,flutter,unix-file-copy-paste --release
            rm -rf target/release/deps target/release/build ~/.cargo
            popd

            # Flutter
            pushd /opt
            wget -q https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            export PATH=/opt/flutter/bin:$PATH
            flutter doctor -v
            (cd /opt/flutter && git apply /workspace/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff)
            popd

            # .deb
            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=amd64
            python3 ./build.py --flutter --skip-cargo
            for name in fatimadesk*??.deb; do mv "$name" "${name%%.deb}-x86_64.deb"; done

            # .rpm (Fedora/RHEL) and .rpm (openSUSE)
            HBB=$(pwd) rpmbuild ./res/rpm-flutter.spec -bb
            for name in ~/rpmbuild/RPMS/x86_64/fatimadesk*??.rpm; do mv "$name" /workspace/"$(basename "${name%%.rpm}").rpm"; done
            HBB=$(pwd) rpmbuild ./res/rpm-flutter-suse.spec -bb
            for name in ~/rpmbuild/RPMS/x86_64/fatimadesk*??.rpm; do mv "$name" /workspace/"$(basename "${name%%.rpm}")-suse.rpm"; done
            ls -l /workspace/fatimadesk*

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fatimadesk-${{ env.VERSION }}-linux-x86_64
          path: |
            fatimadesk-*.deb
            fatimadesk-*.rpm
          if-no-files-found: error
          retention-days: 7
